<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#9bb9c5" />
    <title>Open World — Exploration</title>
  </head>
  <body>
    <main id="game">
      <header id="hud">
        <div class="brand">OPEN WORLD <span>EXPLORATION</span></div>

      <div id="crosshair"></div>\n      <div id="speedometer">E NEAR THE RED CAR TO DRIVE</div>
      <div id="loading">PREPARING THE WORLD</div>
      <div id="footer">EXPLORE THE LANDSCAPE</div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
